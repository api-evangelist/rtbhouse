description: >-
  Entity-relationship graph derived from the response schemas of the RTB House
  Client Panel API v5. The spec declares no components.schemas — every payload is inlined
  per operation — so entities below are named from the resource path and their fields
  read from the inline object schemas. The graph is strongly advertiser-centric — every
  resource except User and ApiToken hangs off /advertisers/{hash}.
root_entity: Advertiser
identifier_style: opaque hash strings; no typed prefixes. The advertiser identifier is
  called `hash` in paths and payloads, `hashId` on User.
entities:
- name: User
  path: GET /user/info
  fields: [hashId, login, email, isClientUser, isDemoUser, permissions]
  note: The authenticated principal. `permissions` is a string array — the closest thing
    the API has to a scope model. `isDemoUser` flags a demonstration account.
- name: ApiToken
  path: POST /tokens/current/rotate
  fields: [token, expiresAt]
  note: Write-only rotation result; there is no read operation for the current token.
- name: Advertiser
  paths:
  - GET /advertisers
  - GET /advertisers/{hash}
  - PUT /advertisers/{hash}/status
  key: hash
  fields: [hash, name, status, url, currency, country, createdAt, features, featuresGroup,
    feedIdentifier, properties, version]
  note: The list projection omits country, featuresGroup and version — the detail
    projection is wider than the collection projection.
- name: Client
  path: GET /advertisers/{hash}/client
  fields: [invoicing]
  note: Billing counterparty of an advertiser.
- name: OfferCategory
  path: GET /advertisers/{hash}/offer-categories
  key: categoryId
  fields: [categoryId, identifier, name, activeOffersNumber]
- name: Offer
  path: GET /advertisers/{hash}/offers
  key: id
  fields: [id, identifier, name, fullName, categoryName, price, currency, url, images,
    status, customProperties, updatedAt]
  note: A product-feed item. Linked to OfferCategory by `categoryName`, a NAME rather
    than the category's id — a soft reference.
- name: Campaign
  path: GET /advertisers/{hash}/campaigns
  key: hash
  fields: [hash, name, campaignType, status, isEditable, creativeIds, rateCardId,
    advertiserLimits, updatedAt]
- name: RtbCreative
  path: GET /advertisers/{hash}/rtb-creatives
  key: hash
  fields: [hash, names, previews, status]
- name: RateCard
  path: GET /advertisers/{hash}/rate-cards
  key: id
  fields: [id, version, cpc, cpm, cpaPostClick, cpaPostView, cpsPostClick, cpsPostView]
- name: Bill
  path: GET /advertisers/{hash}/billing
  fields: [day, operation, position, credit, debit, balance, recordNumber]
  container_fields: [bills, initialBalance]
  note: Returned inside a container object carrying `initialBalance`; a ledger, not a
    keyed resource.
- name: Conversion
  path: GET /advertisers/{hash}/conversions
  key: conversionHash
  fields: [conversionHash, conversionIdentifier, conversionClass, conversionTime,
    conversionValue, commissionValue, cookieHash, lastClickTime, lastImpressionTime]
