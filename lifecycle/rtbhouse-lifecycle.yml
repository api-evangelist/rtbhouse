name: RTB House Client Panel API v5 lifecycle
description: Versioning, deprecation and availability posture for the RTB House Client
  Panel API. RTB House versions in the URI path and signals version drift with a response
  header, but publishes no written deprecation policy, no SLA and no status page.
versioning:
  scheme: uri-path
  current: v5
  base: https://api.panel.rtbhouse.com/v5
  docs: https://api.panel.rtbhouse.com/api/docs
  signal_header: X-Current-Api-Version
  signal_behaviour: Returned on responses. When it differs from the version the caller
    is using, the caller is on an outdated version; the Python SDK emits a warning. A
    call to a retired version returns HTTP 410 Gone with the header naming the successor.
  evidence: rtbhouse_sdk/client.py `_validate_response`; API_VERSION = "v5".
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  mechanism: HTTP 410 Gone plus X-Current-Api-Version on a retired version. This is a
    hard cutover signal, not an advance-notice deprecation contract — a client learns
    the version is gone only when the call fails.
  compatibility_windows_observed:
  - change: The `viewability` metric was renamed to `ssp_viewability`, with a
      compatibility layer left in the API until 2024-12-31.
    source: rtbhouse-python-sdk CHANGELOG.md, v13.0.0
    note: The only dated sunset RTB House has published anywhere. It appears in an SDK
      changelog, not in an API deprecation policy.
  breaking_changes_recent:
  - version: SDK v16.0.0
    change: Removed the `placement` dimension grouping usable with legacy DPA stats.
    date: '2026-06-10'
  pointer_emitted: false
  pointer_rationale: No Deprecation pointer is wired. RTB House publishes no deprecation
    policy page and sends neither Deprecation nor Sunset headers; a 410 on a dead
    version is not a policy.
