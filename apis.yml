  notes: >-
    Pointers deliberately NOT emitted, with the evidence in the matching artifact:
    WellKnown/SecurityTxt (every /.well-known/ path 404s or returns an HTML shell —
    well-known/rtbhouse-well-known.yml); AgentCard (no card on any host);
    MCPServer (no server exists; mcp/rtbhouse-mcp.yml is a derived candidate only);
    Idempotency (the API has no idempotency contract);
    Compliance (the ISO 27001 claim is self-asserted in llms.txt with no compliance
    page behind it); Security/VulnerabilityDisclosure and TrustCenter
    (probe-security-programs.py found neither). Two existing pointers were REMOVED:
    StatusPage aimed at https://api.panel.rtbhouse.com/healthcheck, which returns 404
    and is in any case a liveness endpoint rather than a status page; and Pricing
    aimed at the contact form, since RTB House publishes no pricing page.
