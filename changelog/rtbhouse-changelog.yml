entries:
- version: 16.1.0
  date: '2026-07-15'
  breaking: false
  additions:
  - Custom viewability stats metrics `viewabilityCustomViewability` and `evccpm`.
- version: 16.0.0
  date: '2026-06-10'
  breaking: true
  removals:
  - Removed the `placement` dimension grouping usable with legacy DPA stats.
- version: 15.1.0
  date: '2026-05-04'
  breaking: false
  additions:
  - API token authentication with automatic lifecycle management (ApiTokenAuth,
    ApiTokenManager / AsyncApiTokenManager, pluggable ApiTokenStorage backends).
  - CLI for token management — `python -m rtbhouse_sdk.api_tokens` with `init-json`
    and `keep-alive-json`.
  highlights: Tokens are minted in the Clients Panel at /user/api-tokens, must be used
    to stay alive, and rotate through POST /tokens/current/rotate.
- version: 15.0.0
  date: '2026-01-08'
  breaking: true
  removals:
  - Dropped Python 3.9 (end-of-life). Python 3.10+ required.
- version: 14.2.1
  date: '2025-06-23'
  breaking: false
- version: 14.2.0
  date: '2025-02-26'
  breaking: false
- version: 14.1.0
  date: '2024-12-30'
  breaking: false
- version: 14.0.0
  date: '2024-12-02'
  breaking: true
  removals:
  - Dropped Python 3.8 (end-of-life).
  additions:
  - Support for Python 3.12 and 3.13.
- version: 13.0.0
  date: '2024-09-24'
  breaking: true
  highlights: 'API metric rename with a dated sunset: `viewability` became
    `ssp_viewability`, with a compatibility layer left in the API until 2024-12-31.'
  additions:
  - Audio metrics `audio_complete_listens`, `ecpl`, `acr`.
  - Viewability metrics `viewability_measurability`, `viewability_viewability`, `evcpm`.
  - Visits metrics `visits_count`, `cpvisit`.
- version: 12.0.1
  date: '2024-08-16'
  breaking: false
- version: 12.0.0
  date: '2024-08-08'
  breaking: true
  highlights: Stats metrics `imps_count`, `clicks_count`, `conversions_count`,
    `video_complete_views` became floats to reflect actual API responses (fractional
    values occur with custom grouping or manual adjustment).
- version: 11.1.0
  date: '2023-12-06'
  breaking: false
  additions:
  - '`utc_offset_hours` parameter for get_rtb_stats and get_summary_stats.'
- version: 11.0.0
  date: '2023-11-30'
  breaking: true
  highlights: Pydantic v2 support; `cookie_hash`, `last_click_time`, `last_impression_time`
    on Conversion became nullable; field naming normalized to snake_case.
