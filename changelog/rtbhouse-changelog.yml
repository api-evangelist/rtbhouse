name: RTB House Client Panel API v5 change log
description: RTB House publishes no API changelog on its developer surface — api.panel.rtbhouse.com/api/docs
  renders the current spec with no history, and the corporate site has no release-notes
  page. The only dated record of what changes in the v5 API is the first-party Python
  SDK changelog, whose entries are API-level changes (metrics added, dimensions removed,
  parameters added) rather than library-only churn. Entries below are transcribed from
  that file; dates come from the matching PyPI release.
