name: RTB House conformance profile
description: Which cross-cutting and industry standards the RTB House Client Panel API
  v5 conforms to, asserted from the published contract and observed runtime behaviour.
  RTB House operates in programmatic advertising, so the adtech standards layer matters
  as much as the API layer — but the company's participation there is corporate
  (IAB Tech Lab, NAI, Prebid) and is not expressed in this API's contract.
standards:
- id: openapi-3.0
  conforms: true
  evidence: 'openapi: 3.0.0 served at https://api.panel.rtbhouse.com/api/docs/openapi.yaml,
    rendered by both Swagger UI and Redoc.'
- id: http-basic-auth
  conforms: true
  evidence: >-
    securitySchemes basicAuth (type http, scheme basic); the API answers
    unauthenticated calls with a WWW-Authenticate header of Basic realm="application".
- id: http-bearer-auth
  conforms: true
  evidence: >-
    securitySchemes bearerAuth (type http, scheme bearer); the SDK sends an
    Authorization header carrying `Bearer <api-token>`.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in any spec file; no /.well-known/oauth-authorization-server
    (404 on every host).
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme; /.well-known/openid-configuration returns
    404 on every host.
- id: rfc9457-problem-details
  conforms: false
  evidence: 'Errors use a vendor envelope {status, message, httpCode, appCode, errors}
    with content-type application/json, not application/problem+json.'
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header on any observed response; version retirement
    is signalled only by HTTP 410 plus X-Current-Api-Version.
- id: rfc6585-429
  conforms: true
  evidence: HTTP 429 on resource-budget exhaustion (rtbhouse_sdk/client.py). No
    Retry-After is sent, so the RFC's recommended companion header is absent.
- id: ietf-ratelimit-headers
  conforms: false
  evidence: Neither RateLimit-* nor X-RateLimit-* headers are returned; RTB House uses a
    proprietary X-Resource-Usage header instead.
- id: rfc8615-well-known
  conforms: false
  evidence: Every /.well-known/ path probed on api.panel.rtbhouse.com, www.rtbhouse.com
    and panel.rtbhouse.com returned 404 or an HTML shell. See ../well-known/rtbhouse-well-known.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: No security.txt served; /.well-known/security.txt is 404 on the API host and
